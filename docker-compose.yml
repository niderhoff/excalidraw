services:
  excalidraw:
    build: .
    container_name: excalidraw
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/excalidraw.db
      # Cloudflare R2 — optional, falls back to local filesystem storage
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-excalidraw-files}
    volumes:
      - excalidraw-data:/data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  excalidraw-data:
